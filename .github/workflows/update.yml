name: Update frequencies
on:
  schedule:
    - cron: "17 9 * * 4" # every Thursday; NASR cycles start on Thursdays
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python extract.py
      - name: Commit if changed
        run: |
          git config user.name "frequency-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Frequencies: NASR cycle $(cat docs/cycle.txt)"
          git push
